  # ---------- workspace：角色权限配置（write side of workspace_role, ADR 0012） ----------
  /api/workspaces/{id}/roles:
    get:
      operationId: listRoleConfigs
      tags: [workspace]
      summary: 角色权限矩阵（roles:manage；覆盖行完全取代默认角色集，不是合并）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 可配置角色（admin/member；owner 不可配置）+ 有效权限集 + 代码注册的权限目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleConfig'
                  catalog:
                    type: array
                    items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/workspaces/{id}/roles/{role}:
    put:
      operationId: setRolePerms
      tags: [workspace]
      summary: 设置角色权限覆盖（roles:manage + step-up；写入边界校验 perms ⊆ 代码目录，未知权限 400 拒绝——UI 数据不漂移）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: role
          in: path
          required: true
          schema: { type: string, enum: [admin, member] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perms]
              properties:
                perms:
                  type: array
                  items: { type: string }
                  description: 该角色的完整权限集（替换语义；去重排序后落库）
      responses:
        '200':
          description: 写入后的角色配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/DefaultError'
    delete:
      operationId: resetRolePerms
      tags: [workspace]
      summary: 清除角色权限覆盖、回退内置默认（roles:manage + step-up；幂等）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: role
          in: path
          required: true
          schema: { type: string, enum: [admin, member] }
      responses:
        '204':
          description: 已回退默认
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
