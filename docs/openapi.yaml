  # tenant 侧所有权转让，
  # 与 POST /api/admin/workspaces/{id}/transfer-ownership 同域方法双入口。
  /api/workspaces/{id}/transfer-ownership:
    post:
      operationId: transferOwnership
      tags: [workspace]
      summary: 转让所有权（owner 发起；单事务目标升 owner、原 owner 降 member）
      description: |
        发起者须为本工作区 owner（守卫在 workspace 域，不经 authz 权限矩阵——
        所有权不是成员管理权）。GitLab"至少一个 human owner"语义在域层落地：
        先升后降单事务，任何中途/终态保有 ≥1 owner。域钩子 BeforeOwnerChange
        （Validating 可阻断）/OnOwnerTransfer（Observational）与审计
        workspace.owner_transfer 照旧。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: 工作区 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, description: 新 owner（须是本工作区既有活跃成员且账号未禁用） }
      responses:
        '200':
          description: 已转让
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 发起者非本工作区 owner
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 目标已是 owner/转给自己/目标账号 disabled/并发竞态/BeforeOwnerChange 拦截
        default:
          $ref: '#/components/responses/DefaultError'

