  /api/admin/users/{id}/impersonate:
    post:
      operationId: adminImpersonate
      tags: [admin]
      summary: 模拟用户登录（platform admin；签发目标用户会话 Cookie）
      description: |
        管理员客服排障用：为目标用户签发带模拟标记的新会话（session.impersonated_by
        = 发起管理员 ID，迁移 034 / ADR 0008）并 Set-Cookie tk_auth，
        管理员浏览器即换入目标身份。目标须存在、active、非平台管理员
        （管理员互模禁止）且非操作者本人；发起方本身是模拟会话 → 403
        （链式模拟拦截）。审计 admin.impersonate 留痕
        （actor=管理员快照，meta 带 session_token_hash 指纹）。
        保留语义：管理员原会话被覆盖，退出即回登录页；模拟会话不设独立
        TTL（复用会话 TTL 与吊销机制，退出由发起管理员控制）。
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      responses:
        '200':
          description: 已换入目标用户会话（Set-Cookie tk_auth）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/DefaultError'
