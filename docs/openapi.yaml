# ploykit 中央 OpenAPI 契约。
#
# 覆盖面 = example 应用实际挂载的全部路由（框架各域 adapters/http + example 自有 task/config/健康检查/ws）。
# 路径参数名与 Go 1.22 路由 pattern 逐字一致（{workspaceId}/{id}/{userId}/{invId}/{linkId}/
# {provider}/{channel}/{taskId}/{subscriptionId}/{deliveryId}），供 tools/check_api.py 做漂移比对。
# 共享 schema 字段以 packages/ui 既有 TS 类型（PloykitProvider.tsx 等，前端已消费验证）为准对齐。
# 生成物：packages/client/src/types.ts（openapi-typescript，`npm run gen:types`）。
openapi: 3.1.0
info:
  title: ploykit API
  version: 0.3.0
  description: |
    ploykit 框架 + example 产品应用的 HTTP 契约。

    认证两通道（webx.Authenticate）：
    - 浏览器会话 Cookie `tk_auth`（写请求须带 X-CSRF-Token，/config 拉取 masked token）；
    - PAT `Authorization: Bearer tk_*`（豁免 CSRF）。

    扁平路由（/api/billing/*、/api/usage、/api/audit*、/api/tasks*）的工作区上下文
    由 `X-Workspace-Id` 请求头注入（@ploykit/client 自动携带）。

    错误信封统一为 ErrorBody（webx.ErrorBody）：`{"error":"E_*","message":string,"details"?}`。
security:
  - sessionCookie: []
  - patBearer: []
tags:
  - name: auth
    description: identity 域——验证码/密码登录注册
  - name: oauth
    description: identity 域——第三方登录（env 驱动，未配置时 503）
  - name: account
    description: identity 域——密码重置/邮箱验证（账号自助）
  - name: session
    description: identity 域——会话与资料
  - name: pat
    description: identity 域——个人访问令牌
  - name: workspace
    description: workspace 域——工作区/成员/邀请/分享链接
  - name: billing
    description: billing 域——套餐/结账/订单/webhook 回调
  - name: notify
    description: notify 域——收件箱/角标/已读
  - name: usage
    description: quota 域——套餐用量
  - name: audit
    description: audit 域——工作区审计查询/导出
  - name: admin
    description: admin 域——平台管理（要求 platform admin）
  - name: webhooks
    description: webhooks 域——出站 webhook 订阅管理。投递签名头：X-Signature（当前钥
      HMAC-SHA256）+ X-Signature-Old（secret 轮换后 24h 宽限期内的旧钥双签名，接收方可
      用 VerifySignAny 双候选验签）；时间戳 X-Timestamp、事件 X-Event-Id/X-Event-Type、
      投递 X-Delivery-Id。手动重投复用原 event_id（同事件多 attempt 按投递行 id 区分）。
      接收方逃生协议（Svix abort-message 先例）——接收方可对失败响应（非 2xx）
      携带响应头 Webhook-Delivery 值为 abort-message，投递方收到后直接将本条投递置
      dead 终态、不再重试；对 2xx 响应该头无效果。重试退避含 ±20% 随机抖动，
      防同刻失败惊群。
  - name: tasks
    description: example 产品域——任务（业务域示例）
  - name: system
    description: example——配置/健康检查/调试
  - name: ws
    description: platform/wsx——实时推送通道

paths:
  # ---------- identity：登录/注册（公开） ----------
  /auth/send-code:
    post:
      operationId: sendCode
      tags: [auth]
      summary: 发送登录验证码（dev 模式回 DEV_CODE）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      responses:
        '200':
          description: 已发送（无论邮箱是否存在均回同值，防枚举）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/verify-code:
    post:
      operationId: verifyCode
      tags: [auth]
      summary: 验证码登录（成功签发会话 Cookie tk_auth）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: 登录成功（Set-Cookie tk_auth）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: 邮箱密码注册（成功即登录；不收 code 字段——验证码建号走 send-code → verify-code，见 docs/api-conventions.md）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功（Set-Cookie tk_auth）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 邮箱密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功（Set-Cookie tk_auth）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/DefaultError'

  # ---------- identity：OAuth（公开） ----------
  /auth/fed/start:
    get:
      operationId: fedStart
      tags: [oauth]
      summary: OIDC 联邦登录入口（按工作区 slug 定位 IdP，PKCE S256；302 到 IdP authorize）
      security: []
      parameters:
        - name: workspace
          in: query
          required: true
          schema: { type: string }
          description: 工作区 slug
      responses:
        '302':
          description: 重定向到工作区配置的 OIDC IdP（Set-Cookie tk_fed_oauth，HttpOnly+Lax+10min）
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/fed/callback:
    get:
      operationId: fedCallback
      tags: [oauth]
      summary: OIDC 联邦回调（code+state+PKCE；同邮箱 JIT 关联；成功 302 /app，失败 302 /login?error=fed）
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: 成功回 {APP_URL}/app（Set-Cookie tk_auth；tk_fed_oauth 立即作废）
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: '#/components/responses/DefaultError'
  /api/workspaces/{workspaceId}/sso:
    put:
      operationId: putWorkspaceSSO
      tags: [workspace]
      summary: 配置工作区 OIDC 联邦（owner/admin）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOConfigRequest'
      responses:
        '200':
          description: 已保存的联邦配置（secret 脱敏）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/DefaultError'
    get:
      operationId: getWorkspaceSSO
      tags: [workspace]
      summary: 查看工作区 OIDC 联邦配置（owner/admin；secret 脱敏）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: 联邦配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOConfig'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
    delete:
      operationId: deleteWorkspaceSSO
      tags: [workspace]
      summary: 移除工作区 OIDC 联邦配置（owner/admin）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: 已移除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/oauth/{provider}/start:
    get:
      operationId: oauthStart
      tags: [oauth]
      summary: 发起第三方登录（302 跳转提供商）
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      responses:
        '302':
          description: 重定向到提供商授权页（state 双提交 Cookie）
          headers:
            Location:
              schema:
                type: string
              description: 提供商授权 URL
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/oauth/{provider}/callback:
    get:
      operationId: oauthCallback
      tags: [oauth]
      summary: OAuth 回调（签发会话后 302 回前端；失败 302 /login?error=oauth）
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: 提供商授权码
        - name: state
          in: query
          required: true
          schema: { type: string }
          description: 防 CSRF 状态串
      responses:
        '302':
          description: 成功回 {APP_URL}/app（Set-Cookie tk_auth）；失败回 /login?error=oauth
          headers:
            Location:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/DefaultError'

  # ---------- identity：账号自助（公开） ----------
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [account]
      summary: 申请密码重置邮件（不泄露邮箱存在性）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: 已受理（无论邮箱是否存在）
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [account]
      summary: 凭邮件令牌重置密码（成功后旧会话全吊销）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/send-verification:
    post:
      operationId: sendVerification
      tags: [account]
      summary: 发送邮箱验证邮件（仅浏览器会话）
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 已发送
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [account]
      summary: 凭令牌验证邮箱
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'

  # ---------- identity：会话与资料 ----------
  /auth/logout:
    post:
      operationId: logout
      tags: [session]
      summary: 登出（吊销当前会话并清 Cookie）
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/me:
    get:
      operationId: getMe
      tags: [session]
      summary: 当前用户
      description: |
        模拟会话（管理员 impersonation 签发）额外透出 impersonated_by
        （发起管理员 userID，ADR 0008）；普通会话无此字段。
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/DefaultError'
    patch:
      operationId: updateMe
      tags: [session]
      summary: 更新资料（昵称/头像）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/DefaultError'
    delete:
      operationId: deleteMe
      tags: [session]
      summary: 账号注销（软删除，仅浏览器会话）
      description: |
        软删除当前账号：display_name 置空、密码/PAT 全吊销、tokens_valid_after
        双闸使当前会话即刻失效，响应同时清会话 Cookie。幂等二调（用户已注销）
        返回 404。PAT 调用返回 403（仅浏览器会话可执行）。
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 已注销
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [session]
      summary: 修改密码（成功后轮换会话 Cookie，其余会话吊销；仅浏览器会话）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功（Set-Cookie 新会话）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiresAtResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/confirm-password:
    post:
      operationId: confirmPassword
      tags: [session]
      summary: step-up 重认证（校验密码后为当前会话盖 password_confirmed_at 戳；配合 E_REAUTH_REQUIRED 两段式协议后重试原请求；仅浏览器会话）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: 当前密码
      responses:
        '200':
          description: 确认成功（当前会话新鲜度已更新）
          content:
            application/json:
              schema:
                type: object
                properties:
                  password_confirmed_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/sessions:
    get:
      operationId: listSessions
      tags: [session]
      summary: 当前用户活跃会话列表（仅浏览器会话）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/DefaultError'
    delete:
      operationId: revokeAllSessions
      tags: [session]
      summary: 吊销全部会话（含当前，登出所有设备；仅浏览器会话）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 已全部吊销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/DefaultError'
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [session]
      summary: 吊销单个会话（设备管理；仅浏览器会话）
      description: |
        吊销本人名下指定会话。吊销"当前会话"等价登出（后端不特判、不清
        Cookie，前端按 GET /auth/sessions 的 current 标记提示处理）。
        不存在/已吊销/非本人 → 404（重复吊销幂等）。PAT 调用返回 403
        （仅浏览器会话可执行）。
      security:
        - sessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
          description: 会话 ID（GET /auth/sessions 返回的 id）
      responses:
        '204':
          description: 已吊销
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'

  # ---------- identity：PAT ----------
  /api/tokens:
    get:
      operationId: listPATs
      tags: [pat]
      summary: PAT 列表（仅浏览器会话）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: PAT 列表（不含密钥本体）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PAT'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      operationId: createPAT
      tags: [pat]
      summary: 创建 PAT（token 仅本次响应出现一次；仅浏览器会话）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePATRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePATResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/tokens/{id}:
    delete:
      operationId: revokePAT
      tags: [pat]
      summary: 吊销 PAT（仅浏览器会话）
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          description: 已吊销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOK'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'

  # ---------- workspace：我的工作区 ----------
  /api/workspaces:
    get:
      operationId: listMyWorkspaces
      tags: [workspace]
      summary: 我的工作区列表（含我的角色）
      responses:
        '200':
          description: 工作区列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PKWorkspace'
        '401':
