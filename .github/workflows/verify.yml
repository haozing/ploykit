# verify — PR/push gate (design: capability-impl-plan-2026-10-06.md §3, capability E).
# Four parallel jobs: root Go module / API contract drift / example standalone module / frontend npm workspaces.
# DB integration gate (services: postgres + TEST_DATABASE_URL) belongs to phase 2 and is out of scope for this MVP.
name: verify

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Root Go module: build + vet + test (including the internal/arch architecture boundary tests).
  # test runs with -p 2: renderx watchdog occasionally hits a 30s timeout under full parallelism (CPU contention flake), see plan §1.3.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -p 2 ./...

  # API contract drift: docs/openapi.yaml ↔ route registration (pure Python standard library, zero dependencies).
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/check_api.py

  # Example standalone Go module (go.mod replace points to ../, buildable from the repo root).
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: example/go.sum
      - run: go build ./...
      - run: go test ./...

  # Frontend: npm workspaces monorepo (packages/client, runtime, ui + example/web).
  # A single npm install at the repo root installs everything; the postinstall sync bridge works as usual on Linux (dev-environment.md).
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run check:web
