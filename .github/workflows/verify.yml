# verify — the PR/push gate.
# Four parallel jobs: root Go module (unit + PostgreSQL integration) / API contract drift /
# example standalone module / frontend npm workspaces.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Root Go module: build + vet + test (including the internal/arch architecture boundary tests).
  # Unit run keeps -p 2: renderx watchdog occasionally hits a 30s timeout under full parallelism (CPU contention flake).
  # Integration run is serial (-p 1) against a PostgreSQL service, mirroring `make test-db`.
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pk
          POSTGRES_PASSWORD: pk
          POSTGRES_DB: pk
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U pk -d pk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://pk:pk@localhost:5437/pk?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -p 2 ./...
      - run: go test -p 1 -count=1 ./...

  # API contract drift: docs/openapi.yaml ↔ route registration (pure Python standard library, zero dependencies).
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/check_api.py

  # Example standalone Go module (go.mod replace points to ../, buildable from the repo root).
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: example/go.sum
      - run: go build ./...
      - run: go test ./...

  # Frontend: npm workspaces monorepo (packages/client, runtime, ui + example/web).
  # A single npm install at the repo root installs everything; the postinstall sync bridge works as usual on Linux (dev-environment.md).
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test --workspaces --if-present
      - run: npm run check:web
