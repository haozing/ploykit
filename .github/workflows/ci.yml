name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Go — build, vet, test (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pk
          POSTGRES_PASSWORD: pk
          POSTGRES_DB: pk
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U pk -d pk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://pk:pk@localhost:5437/pk?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build & vet
        run: go build ./... && go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Integration tests (PostgreSQL)
        run: go test -p 1 -count=1 ./...
      - name: Example module (build, vet, test)
        run: |
          cd example
          go build ./...
          go vet ./...
          go test -p 1 -count=1 ./...
      - name: API contract check (OpenAPI ↔ routes)
        run: python3 tools/check_api.py

  frontend:
    name: Frontend — build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build packages (builds @ploykit/ui dist first)
        run: npm run build
      - name: Tests (ui · client · runtime)
        run: npm test --workspaces --if-present
      - name: Typecheck example web
        run: npm run check:web
