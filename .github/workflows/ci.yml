name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Module map and contracts
        run: npm run modules:check

      - name: Module doctor
        run: npm run module:doctor -- all

      - name: Documentation encoding
        run: npm run check -- docs

      - name: Runtime checks
        run: npm run test -- runtime

      - name: Security runtime tests
        run: npm run test -- security

      - name: Web shell tests
        run: npm run test -- web

      - name: Module smoke tests
        run: npm run module:test -- all
