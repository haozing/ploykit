# Release — publish @ploykit/* to npm via OIDC trusted publishing.
# Prerequisites (one-time, on npmjs.com):
#   1. Create the "ploykit" organization (claims the @ploykit scope).
#   2. Publish each package once locally (npm login + npm publish) so the
#      package pages exist.
#   3. On each package's Settings → Trusted Publisher, register:
#      GitHub / haozing / ploykit / .github/workflows/release.yml
# After that, `git tag v0.2.1 && git push --tags` publishes automatically —
# no NPM_TOKEN secret, no long-lived tokens (npm automation tokens that bypass
# 2FA are deprecated; see github.blog 2026-07-08 changelog).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing (OIDC) requires npm >= 11.5.1; node 22 bundles 10.9.x.
      # Pin the 11 line: npm@latest (12.x) hard-requires newer node minors.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Build packages (topological order — ui needs client + runtime dist)
        run: npm run build
      # Publish in dependency order (ui needs client + runtime + hooks).
      # Skip packages whose current version is already on the registry —
      # a tag only republishes what actually bumped.
      - run: |
          set -o pipefail
          for pkg in client runtime hooks ui; do
            v=$(node -p "require('./packages/'$pkg'/package.json').version")
            if [ "$(npm view @ploykit/$pkg version 2>/dev/null)" = "$v" ]; then
              echo "@ploykit/$pkg@$v already published — skipping"
            else
              echo "publishing @ploykit/$pkg@$v"
              if ! npm publish -w @ploykit/$pkg --access public --provenance > /tmp/pub-$pkg.log 2>&1; then
                last=$(tr '\n' '|' < "/tmp/pub-$pkg.log" | tr -cd '\40-\176' | tail -c 1500)
                echo "::error::PUBFAIL @ploykit/$pkg@$v :: $last"
                exit 1
              fi
            fi
          done
