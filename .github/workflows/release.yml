# Release — publish @ploykit/* to npm via OIDC trusted publishing.
# Prerequisites (one-time, on npmjs.com):
#   1. Create the "ploykit" organization (claims the @ploykit scope).
#   2. Publish each package once locally (npm login + npm publish) so the
#      package pages exist.
#   3. On each package's Settings → Trusted Publisher, register:
#      GitHub / haozing / ploykit / .github/workflows/release.yml
# After that, `git tag v0.2.1 && git push --tags` publishes automatically —
# no NPM_TOKEN secret, no long-lived tokens (npm automation tokens that bypass
# 2FA are deprecated; see github.blog 2026-07-08 changelog).
# Before tagging, make sure the number is fresh:
#   git ls-remote --exit-code --tags origin "refs/tags/vX.Y.Z"   # must fail
# Published tags are immutable — sumdb / npm registry records cannot be
# rewritten, so a re-used tag number permanently poisons that version for
# every `go get` / npm consumer. Bump the version instead.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Belt to the per-package "already published — skipping" npm check below:
      # refuse to release a tag number that was already released. This workflow
      # runs on the tag push itself, so the git tag always exists by now — the
      # meaningful immutability oracle is proxy.golang.org, the permanent record
      # for this module's versions (sumdb entries cannot be rewritten). A
      # re-used tag would permanently poison that version for every
      # `go get` / npm consumer.
      - name: Guard against re-using an already-released tag
        run: |
          tag="${GITHUB_REF_NAME}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://proxy.golang.org/${GITHUB_REPOSITORY,,}/@v/${tag}.info")
          case "$code" in
            200)
              echo "::error::tag ${tag} was already released — published tags are immutable (sumdb records cannot be rewritten; a re-used tag number permanently poisons that version for every go get / npm consumer). Bump the version instead."
              exit 1
              ;;
            404|410)
              echo "tag ${tag} not yet recorded by proxy.golang.org — first release, proceeding"
              ;;
            *)
              echo "::error::cannot verify tag ${tag} against proxy.golang.org (HTTP ${code}); refusing to publish while immutability cannot be checked"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing (OIDC) requires npm >= 11.5.1; node 22 bundles 10.9.x.
      # Pin the 11 line: npm@latest (12.x) hard-requires newer node minors.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Build packages (topological order — ui needs client + runtime dist)
        run: npm run build
      # Publish in dependency order (ui needs client + runtime + hooks).
      # Skip packages whose current version is already on the registry —
      # a tag only republishes what actually bumped.
      - run: |
          set -o pipefail
          for pkg in client runtime hooks ui; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$(npm view @ploykit/$pkg version 2>/dev/null)" = "$v" ]; then
              echo "@ploykit/$pkg@$v already published — skipping"
            else
              echo "publishing @ploykit/$pkg@$v"
              if ! npm publish -w @ploykit/$pkg --access public --provenance > /tmp/pub-$pkg.log 2>&1; then
                last=$(tr '\n' '|' < "/tmp/pub-$pkg.log" | tr -cd '\40-\176' | tail -c 1500)
                echo "::error::PUBFAIL @ploykit/$pkg@$v :: $last"
                exit 1
              fi
            fi
          done
