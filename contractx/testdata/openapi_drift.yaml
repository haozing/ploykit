# Same surface as openapi.yaml with exactly two intentional drifts:
#   1. method drift: tasks/{taskId} is POST here, DELETE in the catalog
#      and route table (operationId unchanged so only the method moves);
#   2. extra route: GET .../comments exists only in this document.
openapi: 3.1.0
info:
  title: contractx fixture API (drifted)
  version: 1.0.0
paths:
  /api/workspaces/{workspaceId}/tasks:
    get:
      operationId: listTasks
      responses:
        "200":
          description: task list
    post:
      operationId: createTask
      responses:
        "201":
          description: created
  /api/workspaces/{workspaceId}/tasks/{taskId}:
    get:
      operationId: getTask
      responses:
        "200":
          description: one task
    post:
      operationId: deleteTask
      responses:
        "204":
          description: deleted
  /api/workspaces/{workspaceId}/tasks/{taskId}/comments:
    get:
      operationId: listTaskComments
      responses:
        "200":
          description: comment list
